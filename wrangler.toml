name = "llm-playground"
main = "worker.js"
compatibility_date = "2024-11-11"

# Custom Domain (not a plain route): Wrangler creates the proxied DNS record on
# the timgcavell.com zone, which is required for Cloudflare Access to gate it.
[[routes]]
pattern = "llm.timgcavell.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Identity comes from Cloudflare Access. Fill CF_ACCESS_AUD from the Access
# app's Application Audience (AUD) Tag before deploying: until it is set, the
# deployed Worker refuses every /api/chat request, because an ungated proxy
# would let anyone spend the API keys. Local runs opt out via LOCAL_DEV=1 in
# .dev.vars, which is untracked and never deployed.
[vars]
CF_ACCESS_TEAM_DOMAIN = "timgcavell.cloudflareaccess.com"
CF_ACCESS_AUD = "0801839dd86b96a2e167a36ea8002f6a3c5da56d61bd826fad4f8e1734855c63"

# Provider API keys are secrets, never vars — they must not live in this file:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put OPENAI_API_KEY
# Locally they come from .dev.vars (untracked).
