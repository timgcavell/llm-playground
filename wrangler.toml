name = "llm-playground"
main = "worker.js"
compatibility_date = "2024-11-11"

# Both of these are the defaults once routes are defined; stating them stops
# Wrangler warning on every deploy that it is choosing for us, and pins the
# behaviour rather than leaving it to change under a future default. They are
# top-level keys, so they must stay above the first table header -- inside one
# they silently become that table's fields.
#
# workers.dev stays off deliberately. Enabling it would publish production at a
# second address outside Cloudflare Access -- the same shape of hole that a
# separate hostname always opens, where the login is in front of one door and
# not the other.
workers_dev = false

# Preview URLs are the exception, and they are overridable on their own: branch
# builds run `wrangler versions upload`, and without this there is nothing to
# click on. They live on workers.dev and are public, so the app shell is
# world-readable there. Everything under /api/ still fails closed -- the Worker
# verifies the Access token itself and refuses without one -- so what leaks is
# markup, not keys or conversations.
preview_urls = true

[observability.logs]
enabled = true
invocation_logs = true

# Custom Domain (not a plain route): Wrangler creates the proxied DNS record on
# the timgcavell.com zone, which is required for Cloudflare Access to gate it.
[[routes]]
pattern = "llm.timgcavell.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Identity comes from Cloudflare Access. Fill CF_ACCESS_AUD from the Access
# app's Application Audience (AUD) Tag before deploying: until it is set, the
# deployed Worker refuses every /api/chat request, because an ungated proxy
# would let anyone spend the API keys. Local runs opt out via LOCAL_DEV=1 in
# .dev.vars, which is untracked and never deployed.
[vars]
CF_ACCESS_TEAM_DOMAIN = "timgcavell.cloudflareaccess.com"
# The OAuth issuer identifier. Clients compare the discovered issuer exactly,
# so it is configured rather than derived from the request URL.
PUBLIC_ORIGIN = "https://llm.timgcavell.com"
CF_ACCESS_AUD = "0801839dd86b96a2e167a36ea8002f6a3c5da56d61bd826fad4f8e1734855c63"

# Backs the memory tools. Notes are keyed by the Access email, so one
# namespace holds everyone's without them being reachable from each other.
[[kv_namespaces]]
binding = "MEMORY"
id = "196c11ce704346179769bf28a359a6e7"

# OAuth clients, codes, and tokens for the MCP endpoint. Separate from MEMORY
# so credentials and user notes never share a keyspace.
[[kv_namespaces]]
binding = "OAUTH"
id = "f5abac5b064a494fad33c894e1042924"

# Provider API keys are secrets, never vars — they must not live in this file:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put OPENAI_API_KEY
# And, to enable the web_search tool, whichever of these you have:
#   wrangler secret put BRAVE_SEARCH_API_KEY
#   wrangler secret put TAVILY_API_KEY
# Locally they come from .dev.vars (untracked).
